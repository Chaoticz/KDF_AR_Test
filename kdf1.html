<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kingdomfights AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#111;
}

model-viewer{
width:100%;
height:100%;
}
</style>

</head>

<body>

<model-viewer
src="kingdomfights1.glb"
ios-src="kingdomfights1.usdz"
ar
ar-modes="scene-viewer quick-look webxr"
camera-controls
auto-rotate>

<button slot="ar-button">
Bekijk in AR
</button>

</model-viewer>

</body>
</html>
